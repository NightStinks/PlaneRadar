name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Stamp git SHA as version
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          sed -i "s/0\.0\.0-dev/${SHORT_SHA}/" platformio.ini

      - name: Build firmware
        run: pio run -e planeradar-c3

      - name: Build filesystem image
        run: pio run -e planeradar-c3 --target buildfs

      - name: Collect artifacts
        run: |
          BUILD=.pio/build/planeradar-c3
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          PAGES_BASE="https://${OWNER}.github.io/${REPO}"

          mkdir -p gh-pages
          cp $BUILD/firmware.bin    gh-pages/
          cp $BUILD/bootloader.bin  gh-pages/
          cp $BUILD/partitions.bin  gh-pages/
          cp $BUILD/littlefs.bin    gh-pages/
          cp docs/index.html        gh-pages/

          # manifest.json — relative paths so ESP Web Tools fetches from same origin (no CORS)
          # LittleFS offset 0x290000 = 2686976 from ESP32-C3 default 4MB partition table
          cat > gh-pages/manifest.json << EOF
          {
            "name": "PlaneRadar",
            "version": "${SHORT_SHA}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-C3",
                "parts": [
                  { "path": "bootloader.bin",  "offset": 0       },
                  { "path": "partitions.bin",  "offset": 32768   },
                  { "path": "firmware.bin",    "offset": 65536   },
                  { "path": "littlefs.bin",    "offset": 2686976 }
                ]
              }
            ]
          }
          EOF

          # version.json — consumed by the device OTA checker on each boot
          echo "{\"version\":\"${SHORT_SHA}\",\"url\":\"${PAGES_BASE}/firmware.bin\"}" \
            > gh-pages/version.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
